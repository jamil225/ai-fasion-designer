name: PR Automation, Build & On-Demand Deployment

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch or Git Ref to build & test/deploy'
        required: true
        default: 'main'
      execution_mode:
        description: 'Select action to perform on-demand'
        required: true
        type: choice
        options:
          - 'ephemeral_sanity_check'
          - 'gcp_vm_deploy'
          - 'build_only'
        default: 'ephemeral_sanity_check'

jobs:
  semgrep-security-scan:
    name: 1. Semgrep SAST Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}

      - name: Run Semgrep Security Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci

  build-and-verify:
    name: 2. Build & Code Verification (GitHub VM)
    needs: semgrep-security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend React Assets
        run: |
          cd frontend
          npm ci
          VITE_GOOGLE_CLIENT_ID="50507686337-cgbkqmro01n4boolifghfkl21p6lbgtl.apps.googleusercontent.com" npm run build
          test -d dist && echo "✅ Frontend React dist build succeeded"

  ephemeral-sanity-check:
    name: 3. Ephemeral Sanity Test & Health Check (GitHub VM)
    needs: build-and-verify
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-sanity-check') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Start Application Backend on GitHub VM
        run: |
          echo "▶ Starting FastAPI Backend (uvicorn) on GitHub Runner VM..."
          touch .env
          uvicorn src.main:app --host 127.0.0.1 --port 8083 &
          UVICORN_PID=$!
          echo "UVICORN_PID=$UVICORN_PID" >> $GITHUB_ENV
          sleep 3

      - name: Perform Automated Health Check & Sanity Test
        run: |
          echo "▶ Executing API Health Check on GitHub Runner VM..."
          HEALTH_STATUS="000"
          for i in {1..5}; do
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8083/v1/health || echo "000")
            if [ "$HEALTH_STATUS" -eq 200 ]; then
              echo "✅ Health check PASSED: HTTP 200 OK"
              curl -s http://127.0.0.1:8083/v1/health | jq .
              break
            fi
            echo "Waiting for uvicorn backend initialization... (Attempt $i/5)"
            sleep 2
          done

          if [ "$HEALTH_STATUS" -ne 200 ]; then
            echo "❌ Health check failed with HTTP $HEALTH_STATUS"
            exit 1
          fi

      - name: Stop Application & Cleanup GitHub Runner VM
        if: always()
        run: |
          if [ -n "$UVICORN_PID" ]; then
            echo "▶ Stopping uvicorn backend process (PID: $UVICORN_PID)..."
            kill -9 $UVICORN_PID || true
          fi
          echo "✅ Ephemeral Sanity Test complete! GitHub Runner VM will now be destroyed."

  gcp-vm-deploy:
    name: 4. GCP Staging VM Deployment (On-Demand)
    needs: build-and-verify
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.execution_mode == 'gcp_vm_deploy') || contains(github.event.pull_request.labels.*.name, 'deploy-gcp') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GCP VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            echo "▶ Updating application repository on GCP VM..."
            cd /srv/ai-fashion-designer/app
            git fetch origin
            git checkout -f ${{ github.event.inputs.target_branch || github.head_ref || 'main' }}
            git pull origin ${{ github.event.inputs.target_branch || github.head_ref || 'main' }}

            echo "▶ Updating Python virtual environment..."
            source venv/bin/activate
            pip install -r requirements.txt

            echo "▶ Rebuilding frontend..."
            cd frontend
            npm install
            npm run build
            sudo cp -r dist/* /var/www/ai-fashion-designer/

            echo "▶ Restarting backend service and Nginx..."
            sudo systemctl restart ai-fashion-backend
            sudo systemctl reload nginx

            echo "▶ Verifying Live Endpoint Health..."
            bash /srv/ai-fashion-designer/app/scripts/vm-update.sh ${{ github.event.inputs.target_branch || github.head_ref || 'main' }}

            echo "✅ GCP VM Deployment completed successfully!"
