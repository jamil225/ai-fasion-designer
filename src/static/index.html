<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Fashion Search</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 0.85rem;
      color: #6e6e73;
      margin-top: 0.25rem;
    }

    .search-bar {
      display: flex;
      gap: 0.5rem;
      max-width: 640px;
      margin: 0 auto 1.5rem;
    }

    .search-bar input {
      flex: 1;
      padding: 0.65rem 1rem;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      font-size: 1rem;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-bar input:focus { border-color: #0071e3; }

    .search-bar button {
      padding: 0.65rem 1.25rem;
      background: #0071e3;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .search-bar button:hover { background: #0077ed; }
    .search-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
    #browse-btn { background: #6e6e73; }
    #browse-btn:hover:not(:disabled) { background: #3a3a3c; }

    .ingest-bar {
      max-width: 640px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    #ingest-btn {
      padding: 0.5rem 1rem;
      background: #fff;
      color: #d93025;
      border: 1px solid #d93025;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }

    #ingest-btn:hover:not(:disabled) { background: #d93025; color: #fff; }
    #ingest-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #ingest-status {
      font-size: 0.8rem;
      color: #6e6e73;
    }

    #ingest-status.error { color: #d93025; }
    #ingest-status.success { color: #1a8f3c; }

    /* Search mode toggle */
    .mode-toggle {
      display: flex;
      justify-content: center;
      gap: 0;
      max-width: 640px;
      margin: 0 auto 1rem;
    }

    .mode-toggle button {
      padding: 0.45rem 1.25rem;
      border: 1px solid #d2d2d7;
      background: #fff;
      color: #6e6e73;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-toggle button:first-child {
      border-radius: 8px 0 0 8px;
      border-right: none;
    }

    .mode-toggle button:last-child {
      border-radius: 0 8px 8px 0;
    }

    .mode-toggle button.active {
      background: #0071e3;
      border-color: #0071e3;
      color: #fff;
    }

    .combo-options {
      max-width: 640px;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #6e6e73;
    }

    .combo-options input[type="number"] {
      width: 50px;
      padding: 0.3rem;
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      text-align: center;
      font-size: 0.85rem;
    }

    .enrichment-bar {
      max-width: 900px;
      margin: 0 auto 1rem;
      padding: 0.75rem 1rem;
      background: #e8f4fd;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #1d1d1f;
    }

    .enrichment-bar .label { color: #0071e3; font-weight: 600; }

    /* Combo cards */
    .combo-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      max-width: 520px;
      margin: 0 auto 1.5rem;
      overflow: hidden;
    }

    .combo-header {
      background: #f2f2f7;
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: #3a3a3c;
    }

    .combo-items {
      display: flex;
      align-items: stretch;
    }

    .combo-item {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .combo-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #e5e5ea;
    }

    .combo-item .placeholder {
      width: 100%;
      height: 200px;
      background: #e5e5ea;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    .combo-item-body {
      padding: 0.5rem 0.65rem;
      font-size: 0.72rem;
    }

    .combo-plus {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #0071e3;
      width: 36px;
      flex-shrink: 0;
    }

    .combo-rationale {
      padding: 0.65rem 0.75rem;
      font-size: 0.78rem;
      color: #3a3a3c;
      border-top: 1px solid #f2f2f7;
      line-height: 1.5;
      font-style: italic;
    }

    .section-label {
      max-width: 520px;
      margin: 1.5rem auto 0.75rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #1d1d1f;
    }

    .standalone-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      max-width: 280px;
      margin: 0 auto 1rem;
      overflow: hidden;
    }

    .standalone-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #e5e5ea;
    }

    .standalone-body {
      padding: 0.65rem 0.75rem;
    }

    .standalone-rationale {
      font-size: 0.75rem;
      color: #3a3a3c;
      font-style: italic;
      border-top: 1px solid #f2f2f7;
      padding-top: 0.4rem;
      margin-top: 0.3rem;
      line-height: 1.4;
    }

    #status {
      text-align: center;
      font-size: 0.8rem;
      color: #6e6e73;
      min-height: 1.2em;
      margin-bottom: 1rem;
    }

    #status.error { color: #d93025; }

    #grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      max-width: 1100px;
      margin: 0 auto;
    }

    .tile {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      width: 190px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .tile img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #e5e5ea;
      display: block;
    }

    .tile .placeholder {
      width: 100%;
      height: 190px;
      background: #e5e5ea;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    .tile-body {
      padding: 0.65rem 0.75rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .score {
      font-size: 0.75rem;
      font-weight: 600;
      color: #0071e3;
    }

    .meta-row {
      font-size: 0.72rem;
      color: #3a3a3c;
      line-height: 1.4;
    }

    .meta-row span.label {
      color: #8e8e93;
      font-weight: 500;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-top: 0.1rem;
    }

    .tag {
      background: #f2f2f7;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.65rem;
      color: #3a3a3c;
    }

    .caption {
      font-size: 0.68rem;
      color: #6e6e73;
      font-style: italic;
      line-height: 1.4;
      margin-top: 0.15rem;
      border-top: 1px solid #f2f2f7;
      padding-top: 0.3rem;
    }
  </style>
</head>
<body>

<header>
  <h1>AI Fashion Search</h1>
  <p>Vision-first garment search powered by Gemini + Pinecone</p>
</header>

<div class="mode-toggle">
  <button id="mode-standard" class="active" onclick="setMode('standard')">Standard Search</button>
  <button id="mode-styled" onclick="setMode('styled')">Styled Search</button>
</div>

<div class="search-bar">
  <input type="text" id="query" placeholder="e.g. red wedding dress, casual blue jacket..." />
  <button id="btn" onclick="doSearch()">Search</button>
  <button id="browse-btn" onclick="browseAll()" style="background:#6e6e73;">Browse All</button>
</div>

<div class="combo-options" id="combo-options" style="display:none;">
  <label>Combos: <input type="number" id="combo-count" value="3" min="1" max="10" /></label>
</div>

<div class="ingest-bar">
  <button id="ingest-btn" onclick="ingestAll()" disabled>⬆ Ingest All Images</button>
  <span id="ingest-status"></span>
</div>

<div id="status"></div>
<div id="grid"></div>

<script>
  const API_KEY = "test-key-123";  // local dev only
  let searchMode = "standard";

  function setMode(mode) {
    searchMode = mode;
    document.getElementById("mode-standard").className = mode === "standard" ? "active" : "";
    document.getElementById("mode-styled").className = mode === "styled" ? "active" : "";
    document.getElementById("combo-options").style.display = mode === "styled" ? "flex" : "none";
  }

  function doSearch() {
    if (searchMode === "styled") {
      styledSearch();
    } else {
      search();
    }
  }

  document.getElementById("query").addEventListener("keydown", e => {
    if (e.key === "Enter") doSearch();
  });

  async function search() {
    const query = document.getElementById("query").value.trim();
    if (!query) return;

    const btn = document.getElementById("btn");
    const status = document.getElementById("status");
    const grid = document.getElementById("grid");

    btn.disabled = true;
    status.className = "";
    status.textContent = "Searching…";
    grid.innerHTML = "";

    try {
      const t0 = performance.now();
      const res = await fetch("/v1/search", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-API-Key": API_KEY
        },
        body: JSON.stringify({ query, top_k: 5, strict_mode: false })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail || res.statusText);
      }

      const data = await res.json();
      const elapsed = Math.round(performance.now() - t0);
      const latency = data.latency_ms != null ? data.latency_ms : elapsed;

      if (!data.results || data.results.length === 0) {
        status.textContent = "No results found.";
      } else {
        status.textContent = `${data.results.length} results · latency: ${latency}ms`;
        renderTiles(data.results);
      }
    } catch (err) {
      status.className = "error";
      status.textContent = "Error: " + err.message;
    } finally {
      btn.disabled = false;
    }
  }

  function renderTiles(results) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    results.forEach((r, i) => {
      const attrs = r.matched_attributes || {};
      // image_path is a full filesystem path — extract just the filename
      const filename = (r.image_path || "").split("/").pop().split("\\").pop();
      const score = r.score != null ? (r.score * 100).toFixed(1) + "%" : "—";
      const category = attrs.category || "—";
      const occasion = attrs.occasion || "—";
      const colors = Array.isArray(attrs.colors) ? attrs.colors.join(", ") : (attrs.colors || "—");
      const tags = Array.isArray(r.style_tags) ? r.style_tags : [];
      const caption = r.caption || "";

      const tile = document.createElement("div");
      tile.className = "tile";

      // Image section
      if (filename) {
        const img = document.createElement("img");
        img.alt = category;
        img.loading = "lazy";
        img.onerror = function() {
          const ph = document.createElement("div");
          ph.className = "placeholder";
          ph.textContent = "🧥";
          this.parentNode.replaceChild(ph, this);
        };
        loadImageWithAuth(img, filename);
        tile.appendChild(img);
      } else {
        const ph = document.createElement("div");
        ph.className = "placeholder";
        ph.textContent = "🧥";
        tile.appendChild(ph);
      }

      // Body
      const body = document.createElement("div");
      body.className = "tile-body";

      body.innerHTML = `
        <div class="score">Score: ${score}</div>
        <div class="meta-row"><span class="label">Category: </span>${esc(category)}</div>
        <div class="meta-row"><span class="label">Occasion: </span>${esc(occasion)}</div>
        <div class="meta-row"><span class="label">Colors: </span>${esc(colors)}</div>
      `;

      if (tags.length > 0) {
        const tagsDiv = document.createElement("div");
        tagsDiv.className = "tags";
        tags.slice(0, 6).forEach(t => {
          const span = document.createElement("span");
          span.className = "tag";
          span.textContent = t;
          tagsDiv.appendChild(span);
        });
        body.appendChild(tagsDiv);
      }

      if (caption) {
        const cap = document.createElement("div");
        cap.className = "caption";
        cap.textContent = caption.length > 120 ? caption.slice(0, 117) + "…" : caption;
        body.appendChild(cap);
      }

      tile.appendChild(body);
      grid.appendChild(tile);
    });
  }

  // Fetch image with X-API-Key header, then blob-URL it into the img element
  async function loadImageWithAuth(imgEl, filename) {
    try {
      const res = await fetch(`/v1/images/${encodeURIComponent(filename)}`, {
        headers: { "X-API-Key": API_KEY }
      });
      if (!res.ok) throw new Error("not found");
      const blob = await res.blob();
      imgEl.src = URL.createObjectURL(blob);
    } catch {
      const ph = document.createElement("div");
      ph.className = "placeholder";
      ph.textContent = "🧥";
      imgEl.parentNode && imgEl.parentNode.replaceChild(ph, imgEl);
    }
  }

  async function ingestAll() {
    const btn = document.getElementById("ingest-btn");
    const ist = document.getElementById("ingest-status");

    btn.disabled = true;
    ist.className = "";
    ist.textContent = "Running… this may take a few minutes";

    try {
      const res = await fetch("/v1/ingest/start", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
        body: JSON.stringify({ mode: "full" })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || res.statusText);

      // Fetch detailed stats now that the synchronous job has finished
      const statusRes = await fetch(`/v1/ingest/status/${data.job_id}`, {
        headers: { "X-API-Key": API_KEY }
      });
      const s = await statusRes.json();
      const { processed = 0, total = 0, failed = 0, skipped = 0 } = s;
      ist.className = failed > 0 && processed === 0 ? "error" : "success";
      ist.textContent = `Done — ${processed} processed, ${skipped} skipped, ${failed} failed (${total} total)`;
    } catch (err) {
      ist.className = "error";
      ist.textContent = "Error: " + err.message;
    } finally {
      btn.disabled = false;
    }
  }

  async function browseAll() {
    const btn = document.getElementById("browse-btn");
    const status = document.getElementById("status");
    const grid = document.getElementById("grid");

    btn.disabled = true;
    status.className = "";
    status.textContent = "Loading images…";
    grid.innerHTML = "";

    try {
      const res = await fetch("/v1/images", { headers: { "X-API-Key": API_KEY } });
      if (!res.ok) throw new Error(res.statusText);
      const data = await res.json();
      const filenames = data.filenames || [];
      if (filenames.length === 0) {
        status.textContent = "No images found in folder.";
      } else {
        status.textContent = `${filenames.length} images in folder`;
        filenames.forEach(filename => {
          const tile = document.createElement("div");
          tile.className = "tile";

          const img = document.createElement("img");
          img.alt = filename;
          img.loading = "lazy";
          img.onerror = function() {
            const ph = document.createElement("div");
            ph.className = "placeholder";
            ph.textContent = "🧥";
            this.parentNode.replaceChild(ph, this);
          };
          loadImageWithAuth(img, filename);
          tile.appendChild(img);

          const body = document.createElement("div");
          body.className = "tile-body";
          body.innerHTML = `<div class="meta-row" style="word-break:break-all;">${esc(filename)}</div>`;
          tile.appendChild(body);

          grid.appendChild(tile);
        });
      }
    } catch (err) {
      status.className = "error";
      status.textContent = "Error: " + err.message;
    } finally {
      btn.disabled = false;
    }
  }

  async function styledSearch() {
    const query = document.getElementById("query").value.trim();
    if (!query) return;

    const btn = document.getElementById("btn");
    const status = document.getElementById("status");
    const grid = document.getElementById("grid");
    const comboCount = parseInt(document.getElementById("combo-count").value) || 3;

    btn.disabled = true;
    status.className = "";
    status.textContent = "Searching with stylist agent… this may take a few seconds";
    grid.innerHTML = "";

    try {
      const res = await fetch("/v1/search/styled", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-API-Key": API_KEY
        },
        body: JSON.stringify({ query, combo_count: comboCount, top_k: 20 })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail || res.statusText);
      }

      const data = await res.json();
      const combos = data.combos || [];
      const standalone = data.standalone_outfits || [];

      if (combos.length === 0 && standalone.length === 0) {
        status.textContent = "No outfit combinations found.";
      } else {
        status.textContent = `${combos.length} combos, ${standalone.length} standalone · ${data.total_results_from_vector} vector results · ${data.latency_ms}ms`;
        renderStyledResults(data);
      }
    } catch (err) {
      status.className = "error";
      status.textContent = "Error: " + err.message;
    } finally {
      btn.disabled = false;
    }
  }

  function renderStyledResults(data) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    // Show enrichment info
    if (data.query_enrichment) {
      const bar = document.createElement("div");
      bar.className = "enrichment-bar";
      bar.innerHTML = `<span class="label">Enriched query:</span> ${esc(data.query_enrichment.enriched_query)}`;
      grid.appendChild(bar);
    }

    // Combos
    if (data.combos && data.combos.length > 0) {
      const label = document.createElement("div");
      label.className = "section-label";
      label.textContent = "Outfit Combinations";
      grid.appendChild(label);

      data.combos.forEach(combo => {
        const card = document.createElement("div");
        card.className = "combo-card";

        card.innerHTML = `<div class="combo-header">Combo #${combo.combo_rank}</div>`;

        const items = document.createElement("div");
        items.className = "combo-items";

        // Top item
        const topEl = buildComboItem(combo.top, "Top");
        items.appendChild(topEl);

        // Plus sign
        const plus = document.createElement("div");
        plus.className = "combo-plus";
        plus.textContent = "+";
        items.appendChild(plus);

        // Bottom item
        const bottomEl = buildComboItem(combo.bottom, "Bottom");
        items.appendChild(bottomEl);

        card.appendChild(items);

        // Rationale
        if (combo.styling_rationale) {
          const rat = document.createElement("div");
          rat.className = "combo-rationale";
          rat.textContent = combo.styling_rationale;
          card.appendChild(rat);
        }

        grid.appendChild(card);
      });
    }

    // Standalone outfits
    if (data.standalone_outfits && data.standalone_outfits.length > 0) {
      const label = document.createElement("div");
      label.className = "section-label";
      label.textContent = "Standalone Outfits";
      grid.appendChild(label);

      const standaloneGrid = document.createElement("div");
      standaloneGrid.style.cssText = "display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;";

      data.standalone_outfits.forEach(item => {
        const card = document.createElement("div");
        card.className = "standalone-card";

        const filename = (item.image_path || "").split("/").pop().split("\\").pop();
        if (filename) {
          const img = document.createElement("img");
          img.alt = item.category;
          img.loading = "lazy";
          img.onerror = function() {
            const ph = document.createElement("div");
            ph.className = "placeholder";
            ph.textContent = "🧥";
            this.parentNode.replaceChild(ph, this);
          };
          loadImageWithAuth(img, filename);
          card.appendChild(img);
        }

        const body = document.createElement("div");
        body.className = "standalone-body";
        body.innerHTML = `
          <div class="score">Score: ${(item.score * 100).toFixed(1)}%</div>
          <div class="meta-row"><span class="label">Category: </span>${esc(item.category)}</div>
          <div class="meta-row"><span class="label">Colors: </span>${esc(item.colors.join(", "))}</div>
        `;
        if (item.rationale) {
          body.innerHTML += `<div class="standalone-rationale">${esc(item.rationale)}</div>`;
        }
        card.appendChild(body);
        standaloneGrid.appendChild(card);
      });

      grid.appendChild(standaloneGrid);
    }
  }

  function buildComboItem(product, typeLabel) {
    const el = document.createElement("div");
    el.className = "combo-item";

    const filename = (product.image_path || "").split("/").pop().split("\\").pop();
    if (filename) {
      const img = document.createElement("img");
      img.alt = product.category;
      img.loading = "lazy";
      img.onerror = function() {
        const ph = document.createElement("div");
        ph.className = "placeholder";
        ph.textContent = "🧥";
        this.parentNode.replaceChild(ph, this);
      };
      loadImageWithAuth(img, filename);
      el.appendChild(img);
    }

    const body = document.createElement("div");
    body.className = "combo-item-body";
    body.innerHTML = `
      <div class="score">${esc(typeLabel)}: ${(product.score * 100).toFixed(1)}%</div>
      <div class="meta-row">${esc(product.category)} · ${esc(product.colors.join(", "))}</div>
      <div class="caption">${esc(product.caption)}</div>
    `;
    el.appendChild(body);
    return el;
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
</script>

</body>
</html>
